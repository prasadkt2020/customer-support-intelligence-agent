name: Validate Semantic YAML

on:
  push:
    paths:
      - 'semantic/metrics.yaml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Validate YAML syntax
        run: |
          pip install pyyaml
          python -c "import yaml; yaml.safe_load(open('semantic/metrics.yaml'))"
